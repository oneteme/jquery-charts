name: tag release
on:
  workflow_dispatch:
    inputs:
      core:
        type: boolean
        description: publish jquery-core library
      apexcharts:
        type: boolean
        description: publish jquery-apexcharts library
      highcharts:
        type: boolean
        description: publish jquery-highcharts library
      table:
        type: boolean
        description: publish jquery-table library
      echarts:
        type: boolean
        description: publish jquery-echarts library
      organizer:
        type: boolean
        description: publish jquery-organizer library

env:
  NODE_VERSION: 20
  NODE_ENV: development
  NPM_CONFIG_PRODUCTION: 'false'
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '20000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Report npm environment
      run: |
        node --version
        npm --version
        npm config get registry
        npm config get omit
        npm config get production
        node -e "const lock = require('./package-lock.json'); const packages = Object.values(lock.packages); const privateUrls = packages.filter((entry) => String(entry?.resolved ?? '').includes('proxy-repositoi')).length; console.log('lockfileVersion=' + lock.lockfileVersion + ', packages=' + packages.length + ', privateResolvedUrls=' + privateUrls); if (privateUrls) process.exit(1);"

    - name: Install dependencies
      shell: bash
      run: |
        set +e
        npm ci --include=dev --no-audit --no-fund 2>&1 | tee npm-ci.log
        status=${PIPESTATUS[0]}
        if [ "$status" -ne 0 ]; then
          echo "::error::npm ci failed with exit code $status"
          npm config get registry
          npm config get omit
          npm config get production
          find "$HOME/.npm/_logs" -type f -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -5 | cut -d' ' -f2- | xargs -r -n1 sh -c 'echo "--- $0"; tail -200 "$0"'
          exit "$status"
        fi

    - name: Upload npm diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: npm-diagnostics-${{ github.run_id }}
        path: npm-ci.log
        if-no-files-found: ignore
        retention-days: 7

    - name: Verify Angular CLI
      run: |
        if ! test -x node_modules/.bin/ng; then
          echo "::error::Angular CLI binary is missing after npm ci"
          npm ls @angular/cli --include=dev || true
          ls -la node_modules/.bin || true
          node -e "const lock = require('./package-lock.json'); console.log(lock.packages['node_modules/@angular/cli'] ?? 'Angular CLI is absent from package-lock.json');"
          exit 1
        fi
        npm exec --no -- ng version

    - name: Verify Angular CLI
      run: |
        test -x node_modules/.bin/ng
        npm exec -- ng version

    - run: npm run build

    - uses: oneteme/automation-scripts/.github/actions/npm-scan-project@main
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    - uses: oneteme/automation-scripts/.github/actions/npm-project-version@main
      id: prj_ver

    - name: Validate release version
      env:
        VERSION: ${{ steps.prj_ver.outputs.version }}
      run: |
        node -e "const v = process.env.VERSION; if (!/^\\d+\\.\\d+\\.\\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(v || '')) { throw new Error('Invalid release version: ' + JSON.stringify(v)); } console.log('Release version: ' + v);"

    # Upload COMPLET : dist/ + sources (pour pages et deploy)
    - uses: actions/upload-artifact@v4
      with:
        name: build-complete
        path: |
          dist/
          package.json
          package-lock.json
        retention-days: 1
        compression-level: 6

    outputs:
      version: ${{ steps.prj_ver.outputs.version }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'
        scope: '@oneteme'

    # Récupère les artifacts complets
    - uses: actions/download-artifact@v4
      with:
        name: build-complete

    # Déploie les libs sélectionnées
    - name: Deploy jquery-core
      if: ${{ inputs.core }}
      uses: oneteme/automation-scripts/.github/actions/npm-deploy-project@main
      with:
        project: 'jquery-core'
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: Deploy jquery-apexcharts
      if: ${{ inputs.apexcharts }}
      uses: oneteme/automation-scripts/.github/actions/npm-deploy-project@main
      with:
        project: 'jquery-apexcharts'
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: Deploy jquery-highcharts
      if: ${{ inputs.highcharts }}
      uses: oneteme/automation-scripts/.github/actions/npm-deploy-project@main
      with:
        project: 'jquery-highcharts'
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: Deploy jquery-table
      if: ${{ inputs.table }}
      uses: oneteme/automation-scripts/.github/actions/npm-deploy-project@main
      with:
        project: 'jquery-table'
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: Deploy jquery-echarts
      if: ${{ inputs.echarts }}
      uses: oneteme/automation-scripts/.github/actions/npm-deploy-project@main
      with:
        project: 'jquery-echarts'
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: Deploy jquery-organizer
      if: ${{ inputs.organizer }}
      uses: oneteme/automation-scripts/.github/actions/npm-deploy-project@main
      with:
        project: 'jquery-organizer'
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: oneteme/automation-scripts/.github/actions/github-release-notes@main
      with:
        version: ${{ needs.build.outputs.version }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    # Récupère les artifacts complets
    - uses: actions/download-artifact@v4
      with:
        name: build-complete

    # Réinstalle les dépendances (node_modules n'est pas uploadé)
    - name: Install dependencies
      shell: bash
      run: |
        set +e
        npm ci --include=dev --no-audit --no-fund 2>&1 | tee npm-ci-pages.log
        status=${PIPESTATUS[0]}
        if [ "$status" -ne 0 ]; then
          echo "::error::npm ci failed with exit code $status"
          find "$HOME/.npm/_logs" -type f -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -5 | cut -d' ' -f2- | xargs -r -n1 sh -c 'echo "--- $0"; tail -200 "$0"'
          exit "$status"
        fi

    - name: Upload npm diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: npm-pages-diagnostics-${{ github.run_id }}
        path: npm-ci-pages.log
        if-no-files-found: ignore
        retention-days: 7

    - name: Verify Angular CLI
      run: |
        if ! test -x node_modules/.bin/ng; then
          echo "::error::Angular CLI binary is missing after npm ci"
          npm ls @angular/cli --include=dev || true
          ls -la node_modules/.bin || true
          node -e "const lock = require('./package-lock.json'); console.log(lock.packages['node_modules/@angular/cli'] ?? 'Angular CLI is absent from package-lock.json');"
          exit 1
        fi
        npm exec --no -- ng version

    # Build l'app avec base-href
    - run: npx ng build jquery-charts --base-href=/jquery-charts/

    # GitHub Pages doit servir l'application Angular sur les routes profondes.
    - name: Prepare Angular SPA fallback
      shell: bash
      run: cp dist/jquery-charts/index.html dist/jquery-charts/404.html

    - uses: oneteme/automation-scripts/.github/actions/npm-github-pages@main
      with:
        project: 'jquery-charts'
